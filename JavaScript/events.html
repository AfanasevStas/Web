<!DOCTYPE html>

<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="events.css" />
    <title>JavaScript Events</title>
</head>
<body class="light">
    <div class="header">
        <h3>Header</h3>
        <h3 id="mouse-coords"></h3>
        <div id="switch-background"></div>
        <label for="Input-transition">Введите скорость анимации в сек.:</label>
        <input type="number" id="Input-transition" value="3" step="0.1" min="0.1">
        <!--<img src="moon.png" id="switch-background"/>-->
    </div>
    <h1 id="mouse-coords"></h1>
    <h1>JavaScript Events</h1>
    <div class="images-and-colors">
        <div class="load-image">
            <div class="image-container"><img alt="Фото студента" id="image" /></div>
            <input type="file" id="image-file" onchange="setImage()">
        </div>
        <div class="colors">
            <div>
                <label for="background-color">Выберите цвет фона:</label>
                <input type="color" id="background-color" oninput="setColor(event)"/>
            </div>
            <div>
                <label for="foreground-color">Выберите цвет текста:</label>
                <input type="color" id="foreground-color"  oninput="setColor(event)"/>
            </div>
        </div>
    </div>
    <script>
        function setImage()
        {
            let filename = document.getElementById("image-file");
            let file = filename.files[0];
            document.getElementById("image").src = URL.createObjectURL(file);
        }
        function setBackgroundColor()
        {
            document.body.style.backgroundColor = document.getElementById("background-color").value;
        }
        function setForegroundColor(e)
        {
            document.body.style.color = e.target.value;
        }
        function setColor(e)
        {
            document.body.style[e.target.id === "background-color" ? "background-color" : "color"] = e.target.value;
            //if (e.target.id === "background-color")
            //    document.body.style.backgroundColor = e.target.value;
            //else
            //    document.body.style.color = e.target.value;
        }
        document.addEventListener("mousemove", treckMouse);
        function treckMouse(e)
        {
            let coords =    `Mouse: X = ${e.clientX}, Y = ${e.clientY}`;
            document.getElementById("mouse-coords").innerHTML = coords;
            console.log(coords);
        }

        let input = document.getElementById('Input-transition');
        input.addEventListener
            ('input', function (e)
                {
                    let value = e.target.value;
                    document.documentElement.style.setProperty('--transition-al', `${value}s`);
                }
            );

        document.getElementById("switch-background").addEventListener("click", switchBackground);
        function switchBackground(e)
        {
            //e.target.src = (e.target.src.includes('moon.png') ? 'sun.png' : 'moon.png');
            document.body.className = document.body.className === 'dark' ? 'light' : 'dark';
        }
    </script>
</body>
</html>
